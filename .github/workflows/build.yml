name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk FiltroKM-v1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FiltroKM-v1.${{ github.run_number }}
          path: FiltroKM-v1.${{ github.run_number }}.apk

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: FiltroKM v1.${{ github.run_number }}
          files: FiltroKM-v1.${{ github.run_number }}.apk
