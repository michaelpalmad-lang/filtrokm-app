name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          echo "VC=$((100 + GITHUB_RUN_NUMBER))" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk FiltroKM-v2.${{ github.run_number }}.apk

      - name: Publicar release (la app se actualiza desde aquí)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: FiltroKM v2.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            versionCode=${{ env.VC }}
          make_latest: true
          files: FiltroKM-v2.${{ github.run_number }}.apk
