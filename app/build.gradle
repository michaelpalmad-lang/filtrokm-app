plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'cl.filtrokm'
    compileSdk 34

    defaultConfig {
        applicationId 'cl.filtrokm'
        minSdk 23
        targetSdk 34
        versionCode 100 + runNumber
        versionName "2.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('filtrokm.jks')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias 'filtrokm'
            keyPassword System.getenv("KEYSTORE_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // reconocimiento de texto en el teléfono (sin internet)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
}
